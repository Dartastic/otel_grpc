name: otel_grpc
description: >-
  OpenTelemetry instrumentation for `package:grpc`. Client and server
  interceptors emitting rpc.* spans, propagating W3C trace context via gRPC
  metadata, with recursion suppression.
version: 1.0.0-wip
repository: https://github.com/dartastic/otel_grpc
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.17
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  grpc: ^5.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
